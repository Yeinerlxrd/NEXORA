services:
  mysql:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-nexora}
      MARIADB_USER: ${DB_USERNAME:-nexora}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the root .env file}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        APP_ENV: ${APP_ENV:-local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-nexora}
      DB_USERNAME: ${DB_USERNAME:-nexora}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - edge
      - data

  backend-test:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        APP_ENV: local
    env_file:
      - .env
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    command: ["./vendor/bin/phpunit", "--no-coverage"]
    networks:
      - data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - edge

networks:
  edge:
  data:
    internal: true

volumes:
  mysql_data:
